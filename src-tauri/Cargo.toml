[package]
name = "sistema_solar_3d"
version = "2.0.0"
description = "Simulador del Sistema Solar 3D con astrofisica (edicion de escritorio nativo)"
authors = ["Andres Chavez <andres138chavez@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "sistema_solar_3d"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Perfil de release para un ejecutable liviano
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
